name: Windows Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: Existing stable version tag, for example v0.2.2
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  linux-compatibility:
    if: github.repository == 'miku05231/DSH-Fatwhale-QQ'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.ref }}
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Install the pinned Linux DSH kernel
        run: npm install --prefix state/test-dsh --ignore-scripts --no-audit --no-fund @deepseek-ai/dsh@0.2.0-rc.2
      - name: Verify DSH Web and the no-tools boundary
        env:
          QQ_TEST_DSH_COMMAND: ${{ github.workspace }}/state/test-dsh/node_modules/@deepseek-ai/dsh/lib/bin.js
          QQ_TEST_REQUIRE_DSH: '1'
        run: |
          node tests/dsh-web-test.mjs
          node tests/admin-tool-policy-test.mjs
          node tests/sticker-send-policy-test.mjs
          node tests/sticker-probability-settings-test.mjs
  release:
    if: github.repository == 'miku05231/DSH-Fatwhale-QQ'
    needs: linux-compatibility
    runs-on: windows-latest
    timeout-minutes: 90
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.ref }}
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Validate the stable version and tag
        shell: pwsh
        run: |
          if ($env:RELEASE_TAG -notmatch '^v(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)$') {
            throw 'A stable vMAJOR.MINOR.PATCH tag is required.'
          }
          $taskPackage = Get-Content -LiteralPath package.json -Raw | ConvertFrom-Json
          if ($env:RELEASE_TAG -ne ('v' + $taskPackage.version)) {
            throw 'The tag must match package.json exactly.'
          }
          git rev-parse --verify ('refs/tags/' + $env:RELEASE_TAG)
          if ($LASTEXITCODE -ne 0) { throw 'The version tag does not exist.' }
      - name: Test updates, packaging and the executable
        shell: pwsh
        run: |
          foreach ($taskGroup in @('测试运行器', '托盘', '表情', '打开本地', '更新', 'exe', '封装应用', '公开导出', '桌面连伴')) {
            node tests/run-all.mjs --only $taskGroup
            if ($LASTEXITCODE -ne 0) { throw "Tests failed: $taskGroup" }
          }
      - name: Test administrator boundaries with the pinned DSH kernel
        shell: pwsh
        run: |
          npm install --prefix state/test-dsh --ignore-scripts --no-audit --no-fund @deepseek-ai/dsh@0.2.0-rc.2
          if ($LASTEXITCODE -ne 0) { throw 'The pinned DSH test runtime could not be installed.' }
          $env:QQ_TEST_DSH_COMMAND = Join-Path (Get-Location).Path 'state/test-dsh/node_modules/@deepseek-ai/dsh/lib/bin.js'
          $env:QQ_TEST_REQUIRE_DSH = '1'
          node tests/run-all.mjs --only 管理员权限
          if ($LASTEXITCODE -ne 0) { throw 'Administrator boundary tests failed.' }
          node tests/dsh-web-test.mjs
          if ($LASTEXITCODE -ne 0) { throw 'DSH Web compatibility checks failed.' }
      - name: Build portable files and checksums
        shell: powershell
        run: |
          & scripts\make-release.ps1
          if ($LASTEXITCODE -ne 0) { throw 'Release packaging failed.' }
      - name: Install the actual portable package in an isolated directory
        shell: pwsh
        run: |
          node tests/release-update-test.mjs
          if ($LASTEXITCODE -ne 0) { throw 'The generated portable package cannot be installed safely.' }
      - name: Publish the version and all four assets
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          $taskAssets = @(Get-ChildItem -LiteralPath dist/release -File | ForEach-Object { $_.FullName })
          if ($taskAssets.Count -ne 4) { throw 'Expected three packages and SHA256SUMS.txt.' }
          gh release create $env:RELEASE_TAG @taskAssets --verify-tag --title "QQ-DSH $env:RELEASE_TAG" --generate-notes --latest
          if ($LASTEXITCODE -ne 0) { throw 'Release publication failed; existing releases are never overwritten.' }
      - name: Save isolated test diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: release-test-reports
          path: |
            state/test-log/
            state/updates-ui/
          retention-days: 7
          if-no-files-found: ignore
