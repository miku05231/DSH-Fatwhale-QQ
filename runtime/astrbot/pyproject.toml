[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "qq-astrbot-runtime"
version = "1.0.0"
description = "AstrBot 4.29.3 Python runtime bridge for qq-bridge"
requires-python = ">=3.12,<3.13"
license = "AGPL-3.0-or-later"
dependencies = [
  "astrbot @ https://codeload.github.com/AstrBotDevs/AstrBot/zip/refs/tags/v4.29.3#sha256=4f7187273a3fa3e9bea327e1338dcff7567af5ab095c4847da12452ad22d8508",
  "aiohttp>=3.11.18,<4",
  "APScheduler==3.11.3",
]

[project.optional-dependencies]
test = ["pytest>=8.3,<9", "pytest-asyncio>=0.25,<1"]

[project.scripts]
qq-astrbot-validate = "qq_astrbot.validate:main"

[tool.hatch.build.targets.wheel]
packages = ["qq_astrbot"]
